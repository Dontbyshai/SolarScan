name: Build Solar Scanner (Mac & Windows)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          cd solar-scanner/backend
          pip install -r requirements.txt

      - name: Build Python Backend Executable
        run: |
          cd solar-scanner/backend
          pyinstaller --name solar_backend --onefile main.py
          
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install Node Dependencies
        run: |
          cd solar-scanner/electron
          npm install

      - name: Build Electron App (Mac)
        if: matrix.os == 'macos-latest'
        run: |
          cd solar-scanner/electron
          npm run build:mac
          
      - name: Build Electron App (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd solar-scanner/electron
          npm run build:win

      - name: Upload Artifacts (Mac)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v3
        with:
          name: SolarScanner-Mac
          path: solar-scanner/electron/dist/*.dmg
          
      - name: Upload Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v3
        with:
          name: SolarScanner-Windows
          path: solar-scanner/electron/dist/*.exe
